<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Baru | Re:Use.ID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/signup.css" />
    <style>
      [hidden] {
        display: none !important;
      }
    </style>
      <link rel="stylesheet" href="css/logo.css" />
  </head>
  <body>
    <div class="split" style="grid-template-columns: 1fr">
      <main class="form-panel">
        <!-- 1) sedang memeriksa link -->
        <div class="form-card" id="loadingBox">
          <p class="form-sub">Memeriksa link…</p>
        </div>

        <!-- 2) link valid: form password baru -->
        <form class="form-card" id="resetForm" novalidate hidden>
          <a href="index.html" class="form-logo">
               <span class="mark"><img src="assets/logo-icon.png" alt="Logo Re:Use.ID" style="width:100%;height:100%;object-fit:contain;display:block" /></span>
            Re:Use.ID
          </a>

          <h2 class="form-heading">Buat Password Baru</h2>
          <p class="form-sub">Masukkan password baru untuk akunmu.</p>

          <div class="field">
            <label for="password">Password Baru</label>
            <div class="input-with-icon">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimal 8 karakter"
                required
              />
              <button
                type="button"
                class="toggle-eye"
                data-target="password"
                aria-label="Tampilkan password"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                    stroke="#8A9691"
                    stroke-width="1.8"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="#8A9691"
                    stroke-width="1.8"
                  />
                </svg>
              </button>
            </div>
            <span class="field-error" id="err-password"></span>
          </div>

          <div class="field">
            <label for="confirmPassword">Ulangi Password Baru</label>
            <div class="input-with-icon">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Ketik ulang password"
                required
              />
              <button
                type="button"
                class="toggle-eye"
                data-target="confirmPassword"
                aria-label="Tampilkan password"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                    stroke="#8A9691"
                    stroke-width="1.8"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="#8A9691"
                    stroke-width="1.8"
                  />
                </svg>
              </button>
            </div>
            <span class="field-error" id="err-confirmPassword"></span>
          </div>

          <button type="submit" class="btn-submit">Simpan Password Baru</button>
        </form>

        <!-- 3) link tidak valid / kedaluwarsa -->
        <div class="form-card" id="invalidBox" hidden>
          <h2 class="form-heading">Link Tidak Valid</h2>
          <p class="form-sub">
            Link reset password ini sudah kedaluwarsa atau sudah pernah dipakai.
            Minta link baru, ya.
          </p>
          <a
            href="forgot-password.html"
            class="btn-submit"
            style="text-align: center; text-decoration: none; display: block"
            >Minta Link Baru</a
          >
          <p class="form-footer">
            <a href="login.html" class="inline-link">← Kembali ke Masuk</a>
          </p>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const loadingBox = document.getElementById("loadingBox");
      const resetForm = document.getElementById("resetForm");
      const invalidBox = document.getElementById("invalidBox");

      // Link dari email membawa token di URL. supabase-js membacanya otomatis dan
      // membuat sesi "recovery"; onAuthReady() baru terpicu setelah itu selesai.
      onAuthReady(() => {
        loadingBox.hidden = true;
        if (isLoggedIn()) {
          resetForm.hidden = false;
        } else {
          invalidBox.hidden = false;
        }
      });

      document.querySelectorAll(".toggle-eye").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = document.getElementById(btn.dataset.target);
          target.type = target.type === "password" ? "text" : "password";
        });
      });

      function showError(field, msg) {
        document.getElementById("err-" + field).textContent = msg;
        document.getElementById(field)?.classList.add("invalid");
      }
      function clearError(field) {
        document.getElementById("err-" + field).textContent = "";
        document.getElementById(field)?.classList.remove("invalid");
      }
      resetForm
        .querySelectorAll("input")
        .forEach((i) => i.addEventListener("input", () => clearError(i.id)));

      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError("password");
        clearError("confirmPassword");

        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;
        let hasError = false;

        if (password.length < 8) {
          showError("password", "Password minimal 8 karakter.");
          hasError = true;
        }
        if (confirm !== password || confirm === "") {
          showError("confirmPassword", "Konfirmasi password nggak cocok.");
          hasError = true;
        }
        if (hasError) return;

        const btn = resetForm.querySelector(".btn-submit");
        btn.disabled = true;
        btn.textContent = "Menyimpan…";

        const { error } = await supabaseClient.auth.updateUser({ password });

        if (error) {
          btn.disabled = false;
          btn.textContent = "Simpan Password Baru";
          if (error.code === "same_password") {
            showError(
              "password",
              "Password baru harus berbeda dari yang lama.",
            );
          } else if (error.code === "weak_password") {
            showError(
              "password",
              "Password terlalu lemah. Coba yang lebih panjang atau lebih beragam.",
            );
          } else {
            showError("password", "Gagal menyimpan: " + error.message);
          }
          return;
        }

        btn.textContent = "Berhasil ✓ Mengalihkan…";
        setTimeout(() => {
          window.location.href = "browse.html";
        }, 900);
      });
    </script>
  </body>
</html>
