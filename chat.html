<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pesan | Re:Use.ID</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Chat CSS -->
    <link rel="stylesheet" href="css/chat.css" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

    <!-- Logo CSS -->
    <link rel="stylesheet" href="css/logo.css" />
  </head>

  <body>
    <!-- =====================================================
         TOPBAR
    ====================================================== -->

    <header class="topbar">
      <div class="topbar-inner">
        <!-- Logo -->
        <a href="index.html" class="logo">
          <span class="mark">
            <img
              src="assets/logo-icon.png"
              alt="Logo Re:Use.ID"
              style="
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
              "
            />
          </span>

          Re:Use.ID
        </a>

        <!-- Kembali -->
        <a href="browse.html" class="back-link">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M19 12H5M5 12L12 19M5 12L12 5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          Kembali ke Jelajahi Barang
        </a>
      </div>
    </header>

    <!-- =====================================================
         CHAT SHELL
    ====================================================== -->

    <div class="chat-shell" id="chatShell">
      <!-- ===================================================
           CHAT LIST
      ==================================================== -->

      <aside class="chat-list" id="chatList">
        <div class="chat-list-header">Pesan</div>

        <div id="chatListBody">
          <div class="chat-list-empty">Memuat percakapan…</div>
        </div>
      </aside>

      <!-- ===================================================
           CHAT THREAD
      ==================================================== -->

      <section class="chat-thread" id="chatThread">
        <!-- Belum memilih percakapan -->
        <div class="thread-empty" id="threadEmpty">
          Pilih percakapan di sebelah kiri buat mulai chat.
        </div>

        <!-- Percakapan aktif -->
        <div class="thread-active" id="threadActive" hidden>
          <!-- Header Chat -->
          <div class="thread-header">
            <a
              class="thread-back"
              href="chat.html"
              aria-label="Kembali ke daftar pesan"
            >
              ←
            </a>

            <a
              class="thread-profile-link"
              id="threadProfileLink"
              href="#"
              title="Lihat profil"
            >
              <img
                class="thread-header-avatar"
                id="threadAvatar"
                src=""
                alt="Foto profil pengguna"
              />

              <div>
                <div class="thread-header-name" id="threadName"></div>

                <div class="thread-header-item" id="threadItemName"></div>
              </div>
            </a>

            <a class="thread-profile-btn" id="threadProfileBtn" href="#">
              Lihat Profil
            </a>
          </div>

          <!-- Transaction Panel -->
          <div id="transactionPanel" hidden></div>

          <!-- Messages -->
          <div class="thread-messages" id="threadMessages"></div>

          <!-- Proof Input -->
          <input
            type="file"
            id="proofInput"
            accept="image/png,image/jpeg,image/webp"
            hidden
          />

          <!-- Image Preview -->
          <div class="chat-image-preview" id="chatImagePreview" hidden>
            <img id="chatImagePreviewImg" src="" alt="Preview foto" />

            <div class="chat-image-preview-info">
              <span id="chatImagePreviewName"></span>

              <button
                type="button"
                id="chatImageRemove"
                aria-label="Hapus foto"
              >
                ×
              </button>
            </div>
          </div>

          <!-- Composer -->
          <form class="thread-composer" id="composerForm">
            <!-- Input Foto -->
            <input
              type="file"
              id="chatImageInput"
              accept="image/jpeg,image/png,image/webp"
              hidden
            />

            <!-- Tombol Kamera/Galeri -->
            <button
              type="button"
              class="chat-attach-btn"
              id="chatImageButton"
              title="Kirim foto dari galeri"
              aria-label="Kirim foto dari galeri"
            >
              📷
            </button>

            <!-- Input Pesan -->
            <input
              type="text"
              id="composerInput"
              placeholder="Tulis pesan…"
              autocomplete="off"
              maxlength="1000"
              aria-label="Tulis pesan"
            />

            <!-- Tombol Kirim -->
            <button type="submit" id="composerSend">Kirim</button>
          </form>
        </div>
      </section>
    </div>

    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Supabase Client -->
    <script src="js/supabase-client.js"></script>

    <!-- Auth -->
    <script src="js/auth.js"></script>

    <!-- Notifications -->
    <script src="js/notifications.js"></script>

    <!-- Chat -->
    <script src="js/chat.js"></script>
  </body>
</html>
