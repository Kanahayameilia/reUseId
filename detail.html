<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaket Denim Oversize | Re:Use.ID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/detail.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/logo.css" />
  </head>
  <body id="detailBody">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="index.html" class="logo">
          <span class="mark"
            ><img
              src="assets/logo-icon.png"
              alt="Logo Re:Use.ID"
              style="
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
              "
          /></span>
          Re:Use.ID
        </a>
        <a href="browse.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path
              d="M19 12H5M5 12L12 19M5 12L12 5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Kembali ke Jelajahi Barang
        </a>
        <button
          id="notifBell"
          class="notif-bell"
          aria-label="Notifikasi pesan"
          hidden
          style="margin-left: auto"
        >
          🔔
          <span id="notifBadge" class="notif-badge" hidden>0</span>
        </button>
      </div>
    </header>

    <main class="wrap">
      <div class="detail-grid">
        <section class="gallery">
          <div class="main-photo">
            <img id="mainPhoto" src="" alt="" />
          </div>
          <div class="thumb-row" id="thumbRow"></div>
        </section>

        <!-- RIGHT: info (filled by detail.js) -->
        <section class="info">
          <span class="badge" id="itemBadge"></span>
          <h1 class="item-name" id="itemName"></h1>
          <div class="condition-tag" id="itemCondition"></div>

          <p class="description" id="itemDescription"></p>

          <div class="tags" id="itemTags"></div>
          <div class="tag-panel" id="tagPanel" hidden></div>

          <div class="owner-card">
            <img class="owner-avatar" id="ownerAvatar" src="" alt="" />
            <div class="owner-info">
              <div class="owner-name" id="ownerName"></div>
              <div class="owner-rating" id="ownerRating"></div>
            </div>
            <a href="#" class="profile-link">Lihat Profil</a>
          </div>

          <div class="location-row" id="itemLocation"></div>

          <div class="cta-row">
            <button class="btn-filled" id="btnAjukanBarter">
              Ajukan Barter
            </button>
            <button class="btn-outline" id="btnHubungiPemilik">
              Hubungi Pemilik
            </button>
          </div>
        </section>
      </div>

      <section class="similar-section">
        <h2>Barang Serupa di Dekatmu</h2>
        <div class="similar-scroll" id="similarScroll"></div>
      </section>
    </main>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/detail.js"></script>
  </body>
</html>
