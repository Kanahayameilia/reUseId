<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Re:Use.ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/signup.css">
</head>
<body>

<div class="split">

  <!-- LEFT: eco visual (sama seperti signup) -->
  <aside class="visual-panel">
    <div class="blob" style="width:420px; height:420px; background:#4CAF7D; top:-120px; left:-100px;"></div>
    <div class="blob" style="width:300px; height:300px; background:#E3B94E; bottom:-80px; right:-80px; opacity:0.18;"></div>

    <div class="visual-content">
      <a href="index.html" class="visual-logo">
        <span class="mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C7 6 4 10.5 4 14.5C4 18.6 7.4 22 12 22C16.6 22 20 18.6 20 14.5C20 10.5 17 6 12 2Z" fill="#1A3C34"/></svg>
        </span>
        Re:Use.ID
      </a>

      <div class="reuse-icon">
        <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
          <path d="M60 20C77 20 91 32 95 48" stroke="#4CAF7D" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M95 48L104 40M95 48L86 42" stroke="#4CAF7D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M60 100C43 100 29 88 25 72" stroke="#4CAF7D" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M25 72L16 80M25 72L34 78" stroke="#4CAF7D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M46 60C46 52.3 52.3 46 60 46C67.7 46 74 52.3 74 60C74 67.7 67.7 74 60 74C52.3 74 46 67.7 46 60Z" fill="#4CAF7D" opacity="0.18"/>
          <path d="M60 46V74M46 60H74" stroke="#F5F0E8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </div>

      <h1 class="visual-tagline">Selamat Datang <br><span>Kembali</span></h1>
      <p class="visual-sub">Lanjutin barter dan donasi barang kamu bareng komunitas mahasiswa se-Indonesia.</p>

      <div class="leaf-decor leaf-1">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 5 14.5 5 9.5C5 5.9 8.13 3 12 3C15.87 3 19 5.9 19 9.5C19 14.5 12 21 12 21Z" stroke="#F5F0E8" stroke-width="1.5" opacity="0.5"/></svg>
      </div>
      <div class="leaf-decor leaf-2">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 5 14.5 5 9.5C5 5.9 8.13 3 12 3C15.87 3 19 5.9 19 9.5C19 14.5 12 21 12 21Z" stroke="#F5F0E8" stroke-width="1.5" opacity="0.35"/></svg>
      </div>
    </div>
  </aside>

  <!-- RIGHT: form -->
  <main class="form-panel">
    <form class="form-card" id="loginForm" novalidate>

      <a href="index.html" class="form-logo">
        <span class="mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 2C7 6 4 10.5 4 14.5C4 18.6 7.4 22 12 22C16.6 22 20 18.6 20 14.5C20 10.5 17 6 12 2Z" fill="white"/></svg>
        </span>
        Re:Use.ID
      </a>

      <h2 class="form-heading">Masuk ke Akunmu</h2>
      <p class="form-sub">Lanjutin aktivitas barter &amp; donasi kamu</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nama@student.kampus.ac.id" required>
        <span class="field-error" id="err-email"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <input type="password" id="password" name="password" placeholder="Masukkan password" required>
          <button type="button" class="toggle-eye" data-target="password" aria-label="Tampilkan password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z" stroke="#8A9691" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="#8A9691" stroke-width="1.8"/></svg>
          </button>
        </div>
        <span class="field-error" id="err-password"></span>
      </div>

      <div class="forgot-row">
        <a href="#" class="inline-link">Lupa password?</a>
      </div>

      <button type="submit" class="btn-submit">Masuk</button>

      <div class="divider"><span>atau</span></div>

      <button type="button" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.63h6.46c-.28 1.5-1.13 2.77-2.4 3.62v3.01h3.88c2.27-2.09 3.58-5.17 3.58-8.81z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.92l-3.88-3.01c-1.08.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.95H1.26v3.11C3.23 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.62H1.26C.46 8.24 0 10.07 0 12s.46 3.76 1.26 5.38l4.01-3.11z"/>
          <path fill="#EA4335" d="M12 4.75c1.76 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.23 2.7 1.26 6.62l4.01 3.11c.95-2.84 3.6-4.98 6.73-4.98z"/>
        </svg>
        Masuk dengan Google
      </button>

      <p class="form-footer">Belum punya akun? <a href="signup.html" class="inline-link">Daftar</a></p>

    </form>
  </main>

</div>

<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
