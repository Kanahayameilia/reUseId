<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Password | Re:Use.ID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/signup.css" />
    <style>
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="split" style="grid-template-columns: 1fr">
      <main class="form-panel">
        <form class="form-card" id="forgotForm" novalidate>
          <a href="index.html" class="form-logo">
            <span class="mark"
              ><svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 2C7 6 4 10.5 4 14.5C4 18.6 7.4 22 12 22C16.6 22 20 18.6 20 14.5C20 10.5 17 6 12 2Z"
                  fill="white"
                /></svg
            ></span>
            Re:Use.ID
          </a>

          <h2 class="form-heading">Lupa Password?</h2>
          <p class="form-sub">
            Masukkan email akunmu. Kami kirim link untuk membuat password baru.
          </p>

          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nama@student.kampus.ac.id"
              required
            />
            <span class="field-error" id="err-email"></span>
          </div>

          <p
            id="statusMsg"
            class="form-sub"
            style="color: var(--sage-dark); font-weight: 600"
            hidden
          ></p>

          <button type="submit" class="btn-submit">Kirim Link Reset</button>

          <p class="form-footer">
            <a href="login.html" class="inline-link">← Kembali ke Masuk</a>
          </p>
        </form>
      </main>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById("forgotForm");
      const emailInput = document.getElementById("email");
      const errEmail = document.getElementById("err-email");
      const statusMsg = document.getElementById("statusMsg");
      const submitBtn = form.querySelector(".btn-submit");

      function showError(msg) {
        errEmail.textContent = msg;
        emailInput.classList.add("invalid");
      }
      emailInput.addEventListener("input", () => {
        errEmail.textContent = "";
        emailInput.classList.remove("invalid");
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errEmail.textContent = "";
        statusMsg.hidden = true;

        const email = emailInput.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError("Format email nggak valid.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Mengirim…";

        const { error } = await supabaseClient.auth.resetPasswordForEmail(
          email,
          {
            redirectTo: new URL("reset-password.html", window.location.href)
              .href,
          },
        );

        if (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Kirim Link Reset";
          if (
            error.status === 429 ||
            /rate limit|security purposes/i.test(error.message)
          ) {
            showError(
              "Terlalu sering meminta. Tunggu sebentar lalu coba lagi.",
            );
          } else if (/not authorized/i.test(error.message)) {
            showError(
              "Email ini belum diizinkan menerima email dari Supabase (lihat catatan SMTP).",
            );
          } else {
            showError("Gagal mengirim: " + error.message);
          }
          return;
        }

        // Pesan sengaja netral: nggak membocorkan apakah email itu terdaftar atau tidak.
        statusMsg.textContent =
          "Kalau email itu terdaftar, link reset sudah dikirim. Cek inbox dan folder spam.";
        statusMsg.hidden = false;

        // jeda 60 detik sebelum boleh kirim ulang
        let left = 60;
        submitBtn.textContent = "Kirim ulang (" + left + "d)";
        const timer = setInterval(() => {
          left--;
          if (left <= 0) {
            clearInterval(timer);
            submitBtn.disabled = false;
            submitBtn.textContent = "Kirim Ulang Link";
          } else {
            submitBtn.textContent = "Kirim ulang (" + left + "d)";
          }
        }, 1000);
      });
    </script>
  </body>
</html>
