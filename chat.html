<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesan | Re:Use.ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/chat.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo">
      <span class="mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2C7 6 4 10.5 4 14.5C4 18.6 7.4 22 12 22C16.6 22 20 18.6 20 14.5C20 10.5 17 6 12 2Z" fill="white"/></svg>
      </span>
      Re:Use.ID
    </a>
    <a href="browse.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Kembali ke Jelajahi Barang
    </a>
  </div>
</header>

<div class="chat-shell" id="chatShell">

  <aside class="chat-list" id="chatList">
    <div class="chat-list-header">Pesan</div>
    <div id="chatListBody">
      <div class="chat-list-empty">Memuat percakapan…</div>
    </div>
  </aside>

  <section class="chat-thread" id="chatThread">
    <div class="thread-empty" id="threadEmpty">Pilih percakapan di sebelah kiri buat mulai chat.</div>

    <div class="thread-active" id="threadActive" hidden>
      <div class="thread-header">
        <a class="thread-back" href="chat.html">←</a>
        <img class="thread-header-avatar" id="threadAvatar" src="" alt="">
        <div>
          <div class="thread-header-name" id="threadName"></div>
          <div class="thread-header-item" id="threadItemName"></div>
        </div>
      </div>

      <div class="thread-messages" id="threadMessages"></div>

      <form class="thread-composer" id="composerForm">
        <input type="text" id="composerInput" placeholder="Tulis pesan…" autocomplete="off" maxlength="1000">
        <button type="submit" id="composerSend">Kirim</button>
      </form>
    </div>
  </section>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
